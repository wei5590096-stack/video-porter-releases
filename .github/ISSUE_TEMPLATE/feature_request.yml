name: 功能建议
description: 提出能够让产品更简单、稳定或易用的改进建议
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: 感谢建议。产品优先考虑简单、合规和能够普遍改善体验的功能。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请先描述使用场景和问题，不要只写解决方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的解决方式
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: 这个改进会带来什么帮助
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 合规确认
      options:
        - label: 该建议不要求绕过 DRM、付费墙、登录或平台访问控制。
          required: true
